version: '3.8'
services:
  antiplug:
    build: .
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      - redis
      - searxng
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped

volumes:
  redis_data:
